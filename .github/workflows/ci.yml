name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # needed to push to GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/svc-hello

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: run tests with junit output
        run: gotestsum --junitfile junit.xml -- ./...

      - name: checkout datadog-ci
        if: always()
        uses: actions/checkout@v4
        with:
          repository: DataDog/datadog-ci
          ref: 484c345bbd0df4e1a7beab76316ef75c62d1ab4b
          path: datadog-ci

      - name: set up node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: enable corepack
        if: always()
        run: corepack enable

      - name: install datadog-ci
        if: always()
        working-directory: datadog-ci
        run: |
          yarn install --immutable
          yarn build && yarn bundle:npm
          node packages/datadog-ci/dist/bundle.js version

      - name: upload test results to Datadog CI Visibility
        if: always()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datad0g.com     # Datadog staging
        run: |
          node ${{ github.workspace }}/datadog-ci/packages/datadog-ci/dist/bundle.js junit upload \
            --service svc-hello \
            --env dev \
            --tags team:platform \
            junit.xml

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.vars.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up qemu (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: derive tag
        id: vars
        run: echo "sha7=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.vars.outputs.sha7 }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha7 }}
            ${{ env.IMAGE_NAME }}:latest

      # ---- datadog-ci: correlate image -> CI build job for CD Visibility ----
      - name: checkout datadog-ci
        uses: actions/checkout@v4
        with:
          repository: DataDog/datadog-ci
          ref: 484c345bbd0df4e1a7beab76316ef75c62d1ab4b
          path: datadog-ci

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: enable corepack
        run: corepack enable

      - name: install datadog-ci
        working-directory: datadog-ci
        run: |
          yarn install --immutable
          yarn build && yarn bundle:npm
          node packages/datadog-ci/dist/bundle.js version

      - name: debug ci_env
        working-directory: datadog-ci
        run: |
          node -e "
            const {getCISpanTags} = require('./packages/base/dist/helpers/ci');
            const {CI_ENV_VARS} = require('./packages/base/dist/helpers/tags');
            const tags = getCISpanTags() || {};
            let envVars = {};
            if (tags[CI_ENV_VARS]) { envVars = JSON.parse(tags[CI_ENV_VARS]); delete tags[CI_ENV_VARS]; }
            console.log(JSON.stringify({...tags, ...envVars}, null, 2));
          "

      - name: correlate image to this CI run for CD Visibility
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: datad0g.com
          DD_BETA_COMMANDS_ENABLED: "1"
        run: |
          node ${{ github.workspace }}/datadog-ci/packages/datadog-ci/dist/bundle.js deployment correlate-image \
            --image "${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha7 }}" \
            --commit-sha "${{ github.sha }}" \
            --repository-url "https://github.com/${{ github.repository }}"

  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/svc-hello-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}   # PAT with contents:write on svc-hello-deploy
          path: deploy

      - name: install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: bump image tag
        working-directory: deploy/base
        run: |
          kustomize edit set image ghcr.io/${{ github.repository_owner }}/svc-hello=ghcr.io/${{ github.repository_owner }}/svc-hello:${{ needs.build.outputs.sha7 }}

      - name: commit and push
        working-directory: deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/kustomization.yaml
          git commit -m "bump svc-hello to ${{ needs.build.outputs.sha7 }}" || exit 0
          git push
